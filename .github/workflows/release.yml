# Build a versioned artifact of THIS customized Grok Build on every push.
# Releases (install/auto-update channel) are published from main, v* tags,
# or workflow_dispatch — never from official x.ai/cli or GCS.
name: Custom fork release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-fork-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Resolve fork version
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -1)
          if [ -z "$crate" ]; then
            echo "could not read crates/codegen/xai-grok-version/Cargo.toml version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Plain X.Y.Z (no pre-release suffix): the stable auto-update
            # channel rejects pre-release pointers. Patch = GITHUB_RUN_NUMBER
            # so each push is a distinct version.
            version="${crate%.*}.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          publish=false
          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved fork version $version (tag=v$version publish=$publish)"

  build:
    needs: version
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # Platforms bin/protoc's DotSlash wrapper actually ships (see bin/protoc).
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
            exe: xai-grok-pager
            required: "yes"
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            exe: xai-grok-pager
            required: "no"
          - runner: macos-latest
            platform: macos-aarch64
            exe: xai-grok-pager
            required: "no"
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.required != 'yes' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-pager-bin-release-${{ matrix.platform }}

      - name: Install DotSlash
        run: cargo install dotslash --locked

      - name: Sanity-check hermetic protoc
        run: |
          command -v dotslash
          ./bin/protoc --version

      - name: Build release CLI
        env:
          GROK_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release -p xai-grok-pager-bin

      - name: Package versioned artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          src="target/release/${EXE}"
          test -f "$src"
          mkdir -p dist
          dest="dist/grok-${VERSION}-${PLATFORM}"
          cp "$src" "$dest"
          chmod +x "$dest"
          if command -v zstd >/dev/null 2>&1; then
            zstd -q -19 -o "${dest}.zst" "$dest"
          elif command -v gzip >/dev/null 2>&1; then
            gzip -n -c "$dest" > "${dest}.gz"
          fi
          (cd dist && shasum -a 256 "grok-${VERSION}-${PLATFORM}"* > "SHA256SUMS-${PLATFORM}")
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: grok-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Channel pointers and install scripts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | tee dist/stable dist/alpha dist/enterprise
          cp crates/codegen/xai-grok-pager/scripts/install.sh dist/install.sh
          cp crates/codegen/xai-grok-pager/scripts/install.ps1 dist/install.ps1
          cp crates/codegen/xai-grok-pager/scripts/install-enterprise.sh dist/enterprise-install.sh
          cp crates/codegen/xai-grok-pager/scripts/install-enterprise.ps1 dist/enterprise-install.ps1
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Grok Build (fork) ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          body: |
            Custom-fork build of this repository (`eightHundreds/grok-build`).
            Install and auto-update use **this** release channel, not official `x.ai/cli`.

            ```sh
            curl -fsSL https://github.com/eightHundreds/grok-build/releases/latest/download/install.sh | bash
            ```
